# A BACKSTOP ONLY. Cloudflare's own cron fires every 3 minutes and is the real tick (worker.js scheduled()).
# GitHub throttles */5 schedules hard: measured 2026-09-09, this workflow ran 8 times in 24 hours, not 288,
# with a median gap of 3.5 hours — the runs start on time, GitHub simply does not create most of them.
# So nothing time-sensitive may depend on this file. It exists to cover a Cloudflare outage, nothing more.
name: LMK sync tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick
        env:
          KEY: ${{ secrets.LMK_CRON_KEY }}
        run: |
          code=$(curl -sS -m 60 -o /tmp/out.json -w "%{http_code}" -X POST "https://lmk-api.emieldieuvenson.workers.dev/cron?key=$KEY")
          echo "status $code"; cat /tmp/out.json; echo
          test "$code" = "200"
      # Its own step and its own worker invocation: the sync tick can spend 36 subrequests per cronStep, and
      # a slow Canvas run must never be the reason a morning note does not go out.
      - name: Push
        env:
          KEY: ${{ secrets.LMK_CRON_KEY }}
        run: |
          code=$(curl -sS -m 30 -o /tmp/push.json -w "%{http_code}" -X POST "https://lmk-api.emieldieuvenson.workers.dev/push/send?key=$KEY")
          echo "status $code"; cat /tmp/push.json; echo
          test "$code" = "200"
